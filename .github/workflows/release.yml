name: Release

on:
  push:
    branches:
      - trunk

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Determine changed packages
        id: changed
        run: |
          set -eo pipefail
          echo "SHOULD_PUBLISH=false" >> "$GITHUB_ENV"
          git fetch origin trunk --depth=1 || true
          CHANGED_FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" || true)
          if [ -z "$CHANGED_FILES" ]; then
            CHANGED_FILES=$(git diff --name-only origin/trunk...HEAD || true)
          fi
          if [ -z "$CHANGED_FILES" ]; then
            echo "changed_packages=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$CHANGED_FILES" > .changed-files
          CHANGED_PACKAGES=$(node <<'NODE'
const fs = require('fs');
const { execSync } = require('child_process');
const changed = fs.readFileSync('.changed-files', 'utf8').split(/\r?\n/).filter(Boolean);
const list = JSON.parse(execSync('pnpm ls --depth=-1 --json', { encoding: 'utf8' }));
const repoRoot = process.cwd();
const packages = new Set();
for (const pkg of list) {
  if (!pkg.path) continue;
  const relative = pkg.path.startsWith(repoRoot) ? pkg.path.slice(repoRoot.length + 1) : pkg.path;
  for (const file of changed) {
    if (file.startsWith(relative + '/')) {
      packages.add(pkg.name);
      break;
    }
  }
}
console.log([...packages].join(' '));
NODE
)
          rm -f .changed-files
          if [ -z "$CHANGED_PACKAGES" ]; then
            echo "changed_packages=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed_packages=$CHANGED_PACKAGES" >> "$GITHUB_OUTPUT"
          echo "SHOULD_PUBLISH=true" >> "$GITHUB_ENV"

      - name: Bump package versions (minor)
        if: steps.changed.outputs.changed_packages != ''
        env:
          CHANGED_PACKAGES: ${{ steps.changed.outputs.changed_packages }}
        run: |
          for pkg in $CHANGED_PACKAGES; do
            pnpm --filter "$pkg" version minor --no-git-tag-version
          done
          pnpm install --lockfile-only

      - name: Commit version bump
        if: env.SHOULD_PUBLISH == 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git commit -am "chore: release workspace packages"

      - name: Publish packages
        if: env.SHOULD_PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm publish --filter @1apostoli/use-external-state --no-git-checks --access public
          pnpm publish --filter @1apostoli/use-external-state-next --no-git-checks --access public

      - name: Create release tags
        if: env.SHOULD_PUBLISH == 'true'
        run: |
          core_version=$(node -p "require('./packages/use-external-state/package.json').version")
          next_version=$(node -p "require('./packages/use-external-state-next/package.json').version")
          git tag -a "@1apostoli/use-external-state@${core_version}" -m "Release @1apostoli/use-external-state ${core_version}"
          git tag -a "@1apostoli/use-external-state-next@${next_version}" -m "Release @1apostoli/use-external-state-next ${next_version}"

      - name: Push changes
        if: env.SHOULD_PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin HEAD:trunk --follow-tags
