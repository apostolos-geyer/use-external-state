name: Release

on:
  push:
    branches:
      - trunk

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Determine changed packages
        id: changed
        run: |
          set -eo pipefail
          echo "SHOULD_PUBLISH=false" >> "$GITHUB_ENV"
          git fetch origin trunk --depth=1 || true
          head_ref=${GITHUB_SHA}
          base_ref=${{ github.event.before || 'origin/trunk' }}
          if [ "$base_ref" = "$head_ref" ]; then
            base_ref=origin/trunk
          fi
          git fetch origin "$head_ref" --depth=1 || true
          git fetch origin "$base_ref" --depth=50 || git fetch origin "$base_ref" || true
          echo "Comparing changes from $base_ref to $head_ref"
          CHANGED_PACKAGES=$(node scripts/changed-packages.mjs "$base_ref" "$head_ref")
          echo "Changed packages: $CHANGED_PACKAGES"
          if [ -z "$CHANGED_PACKAGES" ]; then
            echo "changed_packages=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed_packages=$CHANGED_PACKAGES" >> "$GITHUB_OUTPUT"
          echo "SHOULD_PUBLISH=true" >> "$GITHUB_ENV"

      - name: Plan versions
        id: plan
        if: steps.changed.outputs.changed_packages != ''
        env:
          CHANGED_PACKAGES: ${{ steps.changed.outputs.changed_packages }}
        run: |
          set -eo pipefail
          echo "Computing version plan for: $CHANGED_PACKAGES"
          PLAN=$(node scripts/version-plan.mjs $CHANGED_PACKAGES)
          printf '%s\n' "$PLAN"
          while IFS='=' read -r key value; do
            if [ -n "$key" ]; then
              echo "$key=$value" >> "$GITHUB_ENV"
              echo "$key=$value" >> "$GITHUB_OUTPUT"
            fi
          done <<< "$PLAN"

      - name: Bump package versions (minor)
        if: ${{ env.BUMP != '' }}
        env:
          BUMP: ${{ env.BUMP }}
        run: |
          for pkg in $BUMP; do
            pnpm --filter "$pkg" version patch --no-git-tag-version
          done
          pnpm install --lockfile-only

      - name: Commit version bump
        if: ${{ env.BUMP != '' }}
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git commit -am "chore: release workspace packages"

      - name: Publish packages
        if: env.SHOULD_PUBLISH == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH: ${{ env.PUBLISH }}
        run: |
          for pkg in $PUBLISH; do
            pnpm publish --filter "$pkg" --no-git-checks --access public
          done

      - name: Create release tags
        if: env.SHOULD_PUBLISH == 'true'
        env:
          PUBLISH: ${{ env.PUBLISH }}
          VERSIONS: ${{ env.VERSIONS }}
        run: |
          version_for() {
            local pkg="$1"
            for entry in $VERSIONS; do
              local name=${entry%%::*}
              local ver=${entry##*::}
              if [ "$name" = "$pkg" ]; then
                echo "$ver"
                return 0
              fi
            done
            echo ""
          }

          for pkg in $PUBLISH; do
            ver=$(version_for "$pkg")
            if [ -z "$ver" ]; then
              echo "Unable to determine version for $pkg" >&2
              exit 1
            fi
            tag="${pkg}@${ver}"
            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists, skipping"
            else
              git tag -a "$tag" -m "Release $pkg $ver"
            fi
          done

